name: Update Firefox StripOnShare list

on:
  schedule:
    # Runs every Monday at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:   # allows manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the filter list
        run: python striptrackersgen.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add firefox-strip-on-share.txt

          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: update Firefox StripOnShare list ($(date -u +%Y-%m-%d))"
            git push
          fi
